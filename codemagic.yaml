workflows:
  android-workflow:
    name: EggTreat Android Fixed
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    scripts:
      - name: Get Packages
        script: |
          flutter clean
          flutter pub get
      - name: Fix V1 Embedding and Kotlin Issue
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.eggtreat.customers
          flutter pub get
          # Fix Kotlin Version
          sed -i '' "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
