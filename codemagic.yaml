workflows:
  android-workflow:
    name: Android Firebase LIVE
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Android and Setup
        script: |
          flutter create . --platforms=android
          cp google-services.json android/app/  || cp android/app/google-services.json android/app/google-services.json || true
          ls android/app/
      - name: Get Packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
