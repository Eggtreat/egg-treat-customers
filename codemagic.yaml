workflows:
  android-workflow:
    name: EggTreat Android Fixed
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.22.2
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    scripts:
      - name: Get Packages
        script: |
          flutter clean
          flutter pub get
      - name: Fix V1 Embedding Issue
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.eggtreat.customers
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons --verbose
    artifacts:
      - build/**/outputs/**/*.apk
