workflows:
  android-workflow:
    name: Android Firebase LIVE
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Setup Project
        script: |
          flutter create . --platforms=android
          cp google-services.json android/app/google-services.json || true
          
          # Add google-services classpath using Python (safe)
          python3 - << 'PY'
          import pathlib
          b = pathlib.Path("android/build.gradle")
          if b.exists():
              txt=b.read_text()
              if "google-services" not in txt:
                  txt=txt.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'")
                  b.write_text(txt)
          
          ag = pathlib.Path("android/app/build.gradle")
          if ag.exists():
              txt=ag.read_text()
              if "com.google.gms.google-services" not in txt:
                  txt=txt.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
                  # Also add for new flutter structure
                  if "plugins {" in txt and "google-services" not in txt:
                      txt=txt.replace("plugins {", "plugins {\n    id 'com.google.gms.google-services'")
              ag.write_text(txt)
          
          # Fix for settings.gradle
          sg = pathlib.Path("android/settings.gradle")
          if sg.exists():
              print("settings.gradle exists")
          print("Patch Done")
          PY
          
          cat android/app/build.gradle | head -n 30
      - name: Get Packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
