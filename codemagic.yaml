workflows:
  android-workflow:
    name: Simple Build No Error
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK
        script: |
          flutter create. --platforms=android
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
