workflows:
  android-workflow:
    name: Egg Treat Customer APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix Project Structure
        script: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Moved google-services.json"
          fi
          if [ ! -d "lib" ]; then mkdir -p lib; fi
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            runApp(MaterialApp(debugShowCheckedModeBanner: false, home: Scaffold(appBar: AppBar(title: Text("Egg-Treat - Madurai")), body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.egg, size: 80, color: Colors.orange), SizedBox(height:20), Text("Egg-Treat Customer App", style: TextStyle(fontSize:22, fontWeight: FontWeight.bold)), Text("Item-wise | Vendor-wise | Radius | OTP Login"), SizedBox(height:20), Text("APK Build Success!", style: TextStyle(color: Colors.green))]))))));
          }
          EOF
          if [ ! -d "android" ]; then
            flutter create --project-name egg_treat_customers --org com.eggtreat --platforms android .
            cp android/app/google-services.json android/app/google-services.json || true
          fi
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release
      - name: Build AAB for Play Store
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
